}

}

/* ---------- BUTTONS ---------- */

.answer-buttons {
    display: flex;

    justify-content: center;
    margin: 20px 0;
}

.answer-buttons button,
.next-button,

    border: none;

    font-weight: bold;
    cursor: pointer;
}

.phishing {
    background: #ea4335;
    color: white;
}

.safe {
    background: #188038;
    color: white;
}

.next-button,
.restart-button {
    background: #174ea6;
    color: white;
}

button:hover {
    opacity: 0.85;
}

/* ---------- RESULT ---------- */

.result {
    display: none;

}

    margin-top: 0;
}

.clues {
    margin-top: 12px;

.clue {
    padding: 8px;

    border-radius: 6px;
    background: #f1f3f4;
}

.missed {
    background: #fff0f0;
    color: #b3261e;
}

/* ---------- FINAL SCREEN ---------- */

.final {
    display: none;

.final-score {

.review {

.review-item {

    background: #f1f3f4;
}

.review-item strong {
    color: #d93025;
}

/* ---------- PHONE ---------- */

@media (max-width: 600px) {

    .topbar {
        padding: 0 12px;
    }

    .logo {
        font-size: 17px;
    }

    .dashboard {
        display: block;
    }

    .stats {
        justify-content: space-between;

        font-size: 15px;
    }

    .answer-buttons {
        flex-direction: column;
    }

    .answer-buttons button {
        width: 100%;
    }

    .timer {
        text-align: center;
    }
}
</style>
</head>

<body>

                    <strong>From:</strong>

        <!-- ---------- ANSWERS ---------- -->

        <div class="answer-buttons">

            <button class="phishing" onclick="answer('phishing')">
                🚨 <span id="phishingText">Phishing</span>
            </button>

            <button class="safe" onclick="answer('safe')">

        <!-- ---------- RESULT ---------- -->

        <div class="final-score">
            <span id="finalScore">0</span>/12
        </div>

        <div class="high-score">

            <strong id="highScore">0</strong>

            </h3>

            <div id="reviewList"></div>

        <button class="restart-button" onclick="restartGame()">
            🔄 Play Again

    </div>

</div>


<script>

/* =====================================================

const emails = [

    },

    {

            <span class="suspicious">Enter your current password and new password.</span><br><br>

        `,

    },

];


/* =====================================================
   GAME VARIABLES
===================================================== */

let current = 0;
let score = 0;
let lives = 3;
let timeLeft = 30;
let timerInterval;
let answered = false;
let language = "en";

let missedClues = [];


/* =====================================================
   HIGH SCORE
===================================================== */

let highScore = Number(localStorage.getItem("phishingHighScore")) || 0;

document.getElementById("highScore").textContent = highScore;


/* =====================================================
   LOAD EMAIL
===================================================== */

function loadEmail() {

    clearInterval(timerInterval);

    answered = false;

    timeLeft = 30;

    document.getElementById("timer").textContent = timeLeft;

    const email = emails[current];

    document.getElementById("questionNumber").textContent = current + 1;

    document.getElementById("sender").textContent = email.sender;

    document.getElementById("subject").textContent = email.subject;

    document.getElementById("emailBody").innerHTML = email.body;

    document.getElementById("score").textContent = score;

    updateHearts();

    document.getElementById("result").style.display = "none";

    startTimer();
}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    timerInterval = setInterval(() => {

        timeLeft--;

        document.getElementById("timer").textContent = timeLeft;

        if (timeLeft <= 10) {
            document.querySelector(".timer").classList.add("warning");
        }

        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            if (!answered) {

                loseLife();

                showResult(false, "⏰ Time's up!");

            }

        }

    }, 1000);
}


/* =====================================================
   ANSWER
===================================================== */

function answer(choice) {

    if (answered) return;

    answered = true;

    clearInterval(timerInterval);

    const email = emails[current];

    if (choice === email.answer) {

        score++;

        document.getElementById("score").textContent = score;

        showResult(true, "✅ Correct!");

    } else {

        loseLife();

        showResult(false, "❌ Incorrect!");

    }

}


/* =====================================================
   LOSE LIFE
===================================================== */

function loseLife() {

    lives--;

    updateHearts();

    if (lives <= 0) {

        setTimeout(() => {
            finishGame();
        }, 1000);

    }

}


/* =====================================================
   HEARTS
===================================================== */

function updateHearts() {

    let hearts = "";

    for (let i = 0; i < lives; i++) {
        hearts += "❤️ ";
    }

    for (let i = lives; i < 3; i++) {
        hearts += "🖤 ";
    }

    document.getElementById("hearts").textContent = hearts;
}


/* =====================================================
   SHOW RESULT
===================================================== */

function showResult(correct, title) {

    const email = emails[current];

    document.getElementById("resultTitle").textContent = title;

    if (correct) {

        document.getElementById("resultExplanation").textContent =
            "Great job! You correctly identified this email.";

    } else {

        document.getElementById("resultExplanation").textContent =
            "Look carefully at the warning signs in this email.";

        if (email.clues.length > 0) {

            email.clues.forEach(clue => {

                missedClues.push({
                    email: email.subject,
                    clue: clue
                });

            });

        }

    }


    const clueList = document.getElementById("clueList");

    clueList.innerHTML = "";

    if (email.clues.length === 0) {

        clueList.innerHTML =
            "<div class='clue'>No major phishing warning signs.</div>";

    } else {

        email.clues.forEach(clue => {

            const div = document.createElement("div");

            div.className = "clue";

            div.textContent = "⚠️ " + clue;

            clueList.appendChild(div);

        });

    }

    document.getElementById("result").style.display = "block";

}


/* =====================================================
   NEXT EMAIL
===================================================== */

function nextEmail() {

    if (lives <= 0) {

        finishGame();

        return;
    }

    current++;

    if (current >= emails.length) {

        finishGame();

    } else {

        document.querySelector(".timer").classList.remove("warning");

        loadEmail();

    }

}


/* =====================================================
   FINISH GAME
===================================================== */

function finishGame() {

    clearInterval(timerInterval);

    document.getElementById("game").style.display = "none";

    document.getElementById("final").style.display = "block";

    document.getElementById("finalScore").textContent = score;

    if (score > highScore) {

        highScore = score;

        localStorage.setItem("phishingHighScore", highScore);

    }

    document.getElementById("highScore").textContent = highScore;


    if (score >= 10) {

        document.getElementById("finalMessage").textContent =
            "🏆 Amazing! You are excellent at spotting phishing attempts.";

    } else if (score >= 7) {

        document.getElementById("finalMessage").textContent =
            "👏 Great job! You know many important phishing warning signs.";

    } else if (score >= 4) {

        document.getElementById("finalMessage").textContent =
            "👍 Good start! Keep practicing your phishing detection skills.";

    } else {

        document.getElementById("finalMessage").textContent =
            "📚 Keep learning! Knowing the warning signs can help protect you online.";

    }


    const review = document.getElementById("reviewList");

    review.innerHTML = "";

    if (missedClues.length === 0) {

        review.innerHTML =
            "<div class='review-item'>🎉 You didn't miss any phishing clues!</div>";

    } else {

        missedClues.forEach(item => {

            const div = document.createElement("div");

            div.className = "review-item";

            div.innerHTML =
                `<strong>${item.email}</strong><br>
                 ⚠️ ${item.clue}`;

            review.appendChild(div);

        });

    }

}


/* =====================================================
   RESTART
===================================================== */

function restartGame() {

    current = 0;

    score = 0;

    lives = 3;

    missedClues = [];

    document.getElementById("game").style.display = "block";

    document.getElementById("final").style.display = "none";

    loadEmail();

}


/* =====================================================
   LANGUAGE SWITCH
===================================================== */

function changeLanguage() {

    language = language === "en" ? "fr" : "en";

    if (language === "fr") {

        document.querySelector(".language").textContent =
            "🇬🇧 English";

        document.getElementById("questionText").textContent =
            "Courriel";

        document.getElementById("phishingText").textContent =
            "Hameçonnage";

        document.getElementById("safeText").textContent =
            "Sécuritaire";

        document.getElementById("cluesTitle").textContent =
            "Indices d'hameçonnage :";

        document.getElementById("reviewTitle").textContent =
            "📊 Indices d'hameçonnage manqués";

        document.getElementById("finalTitle").textContent =
            "🎉 Jeu terminé!";

    } else {

        document.querySelector(".language").textContent =
            "🇫🇷 Français";

        document.getElementById("questionText").textContent =
            "Email";

        document.getElementById("phishingText").textContent =
            "Phishing";

        document.getElementById("safeText").textContent =
            "Safe";

        document.getElementById("cluesTitle").textContent =
            "Phishing clues:";

        document.getElementById("reviewTitle").textContent =
            "📊 Phishing clues you missed";

        document.getElementById("finalTitle").textContent =
            "🎉 Game Complete!";

    }

}


/* =====================================================
   START
===================================================== */

loadEmail();

</script>

</body>
</html>
